
# Base configuration for consistent settings across all experiments
base_config:
  seed: 42
  embedding_model: "default-embedding-model" # Placeholder, assume a default
  retriever_settings: {} # Placeholder for retriever specific settings
  generator_settings: {} # Placeholder for generator specific settings
  thresholds: {} # Placeholder for any thresholds

# Dataset paths
dataset_paths:
  triviaqa: "PSM_NEW/data/triviaqa.jsonl" # Assuming this path based on context
  nq: "PSM_NEW/data/natural_questions.jsonl"
  hotpotqa: "PSM_NEW/data/hotpotqa.jsonl"

# Experiment configurations
experiments:
  - dataset: triviaqa
    modes:
      - name: smoke
        max_samples: 20
      - name: subset
        max_samples: 200
      - name: full
        max_samples: -1 # -1 signifies full dataset
  - dataset: nq
    modes:
      - name: smoke
        max_samples: 20
      - name: subset
        max_samples: 200
      - name: full
        max_samples: -1
  - dataset: hotpotqa
    modes:
      - name: smoke
        max_samples: 20
      - name: subset
        max_samples: 200
      - name: full
        max_samples: -1

output_dir: "outputs/metrics"
