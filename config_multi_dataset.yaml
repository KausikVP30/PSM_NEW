run:
  seed: 42
  mode: subset
  device: gpu
  max_samples_smoke: 20
  max_samples_subset: 200

data:
  dataset_name: all
  skip_no_evidence: true
  dataset_paths:
    nq: data/nq_full_candidate.jsonl
    triviaqa: data/triviaqa_full.jsonl
    hotpotqa: data/hotpotqa_full.jsonl
  auto_discover_kaggle_inputs: true

retrieval:
  top_k_sparse: 30
  top_k_dense: 30
  top_k_fused: 20
  top_k_rerank: 20
  top_k_final: 10               # Increased from 5

  sparse_weight: 0.45           # Increased semantic influence
  dense_weight: 0.55

  doc_score_min: 0.0
  doc_text_max_chars: 1000

  embedding_model: sentence-transformers/all-MiniLM-L6-v2

  hnsw_m: 16
  hnsw_ef_construction: 200
  hnsw_ef_search: 96            # Increased search recall

reranking:
  enabled: true

  overlap_weight: 0.60          # Reduced lexical bias
  dense_weight: 0.40

  cross_encoder_model: ""

gating:
  similarity_threshold: 0.60    # tau_s — matches memory.similarity_threshold below for consistency
  quality_threshold: 0.55       # tau_c — matches memory.min_quality below

  fallback_expand_k: 40

  memory_write_f1_threshold: 0.50

memory:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2

  similarity_threshold: 0.62    # Slightly stricter

  write_rouge_threshold: 0.50
  write_reranker_threshold: 0.20

  min_quality: 0.50             # Store higher-quality memories

  require_evidence_support: false

  max_items: 500

  persist_embeddings: true
  persist_dir: outputs/memory_embeddings

  device: gpu

  quality_metric_weights:
    reranker_score: 0.35
    rouge_l_score: 0.65

generation:
  enabled: true

  backend: ollama

  model_name: llama3

  ollama_endpoint: http://127.0.0.1:11435

  max_new_tokens: 48            # More concise answers
  temperature: 0.1

evaluation:
  compute_rouge_l: true
  compute_bleu: true

output:
  predictions_csv: outputs/predictions/predictions.csv
  metrics_json: outputs/metrics/metrics.json
  log_file: outputs/logs/multi_dataset.log

kaggle:
  working_dir: /kaggle/working
  input_dir: /kaggle/input


