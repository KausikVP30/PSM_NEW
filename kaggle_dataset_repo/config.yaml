run:
  seed: 42
  mode: smoke
  device: auto
  max_samples_smoke: 20
  max_samples_subset: 200

data:
  dataset_name: synthetic_demo
  dataset_paths:
    nq: ""
    triviaqa: ""
    hotpotqa: ""
  auto_discover_kaggle_inputs: true

retrieval:
  top_k_sparse: 30
  top_k_dense: 30
  top_k_fused: 20
  top_k_rerank: 20
  top_k_final: 5
  sparse_weight: 0.5
  dense_weight: 0.5
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  hnsw_m: 16
  hnsw_ef_construction: 200
  hnsw_ef_search: 64

reranking:
  enabled: true
  overlap_weight: 0.7
  dense_weight: 0.3

gating:
  confidence_threshold: 0.45
  fallback_expand_k: 40

generation:
  enabled: false
  model_name: google/flan-t5-small
  max_new_tokens: 64
  temperature: 0.0

evaluation:
  compute_rouge_l: true
  compute_bleu: true

output:
  predictions_csv: outputs/predictions/predictions.csv
  metrics_json: outputs/metrics/metrics.json
  log_file: outputs/logs/run.log

kaggle:
  working_dir: /kaggle/working
  input_dir: /kaggle/input
